<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Rendaven — AI-Powered Crypto Trading Platform | Now in Australia</title>

      name="description"
      content="Rendaven is an AI-powered trading platform for Bitcoin, Ethereum and 300+ assets — with 256-bit encryption, 98% cold storage and 24/7 support. Now available in Australia."
    />

    <!-- Open Graph / Twitter (defaults; per-route values are set via useMeta) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rendaven" />
    <meta property="og:title" content="Rendaven — AI-Powered Crypto Trading Platform" />
    <meta
      property="og:description"
      content="Trade Bitcoin, Ethereum and 300+ assets with an AI-driven engine, 256-bit encryption and 98% cold storage. Now available in Australia."
    />
    <meta property="og:url" content="https://rendaven.com/" />
    <meta property="og:image" content="https://rendaven.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rendaven — AI-Powered Crypto Trading Platform" />
    <meta
      name="twitter:description"
      content="Trade Bitcoin, Ethereum and 300+ assets with an AI-driven engine, 256-bit encryption and 98% cold storage. Now available in Australia."
    />
    <meta name="twitter:image" content="https://rendaven.com/og-image.png" />

    <!-- Fonts: Chakra Petch (display/numerals) + Inter (body) — cobalt blueprint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Rendaven",
            "url": "https://rendaven.com/",
            "logo": "https://rendaven.com/favicon.svg",
            "contactPoint": {
              "@type": "ContactPoint",
              "email": "support@rendaven.com",
              "contactType": "customer support",
              "availableLanguage": ["English"]
            }
          },
          {
            "@type": "WebSite",
            "name": "Rendaven",
            "url": "https://rendaven.com/"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

</html>
